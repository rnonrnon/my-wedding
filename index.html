<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>החתונה שלי</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="החתונה שלי">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FBF6F1">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --bg:#FBF6F1; --card:#FFFFFF; --rose:#C98B91; --rose-d:#A7636C; --rose-l:#F5E4E3; --rose-xl:#FBF0EE;
  --gold:#B8955B; --gold-l:#F1E6D1; --ink:#3D2B2E; --muted:#8E7B7D; --line:#EFE2DC;
  --ok:#5F9473; --ok-l:#E4F0E8; --danger:#C0565B; --r:18px; --shadow:0 2px 12px rgba(120,70,70,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Hebrew","Segoe UI",Rubik,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
#app{height:100%}
.shell{position:fixed;inset:0;display:flex;flex-direction:column}
.view{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) 16px 28px}
.tabbar{display:flex;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 4px)}
.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
.tab svg{width:25px;height:25px}
.tab.on{color:var(--rose-d);font-weight:600}
svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}

/* headers */
.head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.head h1{font-size:28px;margin:0;font-weight:700;letter-spacing:-.3px}
.head-actions{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--rose-d);flex:none}
.icon-btn svg{width:21px;height:21px}
.icon-btn.plain{background:none;box-shadow:none}
.topbar{display:flex;justify-content:flex-end;margin-bottom:6px}
h2.sec{font-size:17px;margin:22px 2px 10px;font-weight:700}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px 20px 22px;text-align:center;
  background:linear-gradient(160deg,#F2D3D3 0%,#F8E7E1 55%,#F3E6D3 100%);box-shadow:var(--shadow)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;border:1.5px solid rgba(184,149,91,.35)}
.hero:before{width:180px;height:180px;top:-70px;left:-60px}
.hero:after{width:120px;height:120px;bottom:-50px;right:-30px}
.hero-names{font-size:27px;font-weight:300;letter-spacing:.3px;position:relative}
.hero-names .amp{color:var(--gold);font-weight:400;margin:0 4px}
.hero-date{margin-top:6px;font-size:15px;color:#6E5558;position:relative}
.hero-heb{font-size:13px;color:var(--muted);margin-top:2px;position:relative}
.countdown{margin-top:16px;position:relative}
.cd-num{font-size:64px;line-height:1;font-weight:200;color:var(--rose-d)}
.cd-lbl{font-size:15px;color:#6E5558;margin-top:4px}
.cd-big{font-size:24px;font-weight:400;color:var(--rose-d)}

/* quick add */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.quick button{border:0;background:var(--card);border-radius:16px;padding:12px 4px;box-shadow:var(--shadow);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:6px}
.quick .qi{width:38px;height:38px;border-radius:50%;background:var(--rose-xl);display:grid;place-items:center;color:var(--rose-d)}
.quick .qi svg{width:20px;height:20px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:0;text-align:right;background:var(--card);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.stat .s-lbl{font-size:13px;color:var(--muted)}
.stat .s-val{font-size:22px;font-weight:600;margin-top:4px}
.stat .s-sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat .s-sub.late{color:var(--danger)}

/* cards & lists */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px}
.date-badge{width:50px;flex:none;text-align:center;border-radius:14px;background:var(--rose-xl);padding:6px 0;color:var(--rose-d)}
.date-badge b{display:block;font-size:20px;line-height:1.1}
.date-badge span{font-size:12px}
.date-badge.past{background:#F3EFEE;color:var(--muted)}
.item-main,.ri-main{flex:1;min-width:0}
.item-title,.ri-title{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.item-sub,.ri-sub{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ri-sub svg{width:13px;height:13px}
.ri-sub.late{color:var(--danger)}
.tag{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;background:var(--gold-l);color:#7C6234;border-radius:20px;padding:2px 8px}
.tag svg{width:12px;height:12px}

.row-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.row-item.done .ri-title{text-decoration:line-through;color:var(--muted);font-weight:400}
.check{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--rose);background:none;display:grid;place-items:center;padding:0;color:#fff}
.check.on{background:var(--rose);border-color:var(--rose)}
.check svg{width:16px;height:16px;stroke-width:2.6}

.quick-add{display:flex;gap:8px;margin-bottom:14px}
.quick-add input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px;outline:none;min-width:0}
.quick-add input:focus{border-color:var(--rose)}
.add-btn{width:50px;flex:none;border:0;border-radius:14px;background:var(--rose-d);color:#fff;font-size:26px;line-height:1}
.fab-row{display:flex;gap:8px;margin-bottom:14px}

.seg{display:flex;background:#F1E7E3;border-radius:12px;padding:3px;margin-bottom:14px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:8px 2px;font-size:13.5px;color:#6E5558;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);font-weight:600;color:var(--ink)}
.seg small{font-size:11px;color:var(--muted);margin-inline-start:3px}

.empty{text-align:center;color:var(--muted);padding:34px 16px}
.empty .e-ic{font-size:38px;margin-bottom:8px}
.empty p{margin:4px 0 14px;font-size:15px}

.btn{border:0;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;background:var(--rose-d);color:#fff;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:19px;height:19px}
.btn.ghost{background:var(--rose-xl);color:var(--rose-d)}
.btn.soft{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:#FBE9E9;color:var(--danger)}
.btn.small{width:auto;padding:10px 14px;font-size:14px}
.btn-col{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.btn-row{display:flex;gap:10px}
.btn-row .btn{flex:1}
.link{border:0;background:none;color:var(--rose-d);font-size:15px;padding:10px;text-decoration:underline}

/* money */
.total-card{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(150deg,#F4DADA,#F7EADF);border-radius:var(--r);padding:16px;margin-bottom:12px}
.total-card .t-lbl{font-size:14px;color:#6E5558}
.total-card .t-val{font-size:26px;font-weight:600}
.amt{font-weight:600;font-size:15.5px;white-space:nowrap}
.vendor .v-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.v-amt{font-weight:600;white-space:nowrap}
.bar{height:7px;border-radius:7px;background:#F1E7E3;margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rose));border-radius:7px}
.v-pay{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.v-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:7px 12px;font-size:13.5px;color:var(--ink);text-decoration:none}
.mini svg{width:15px;height:15px}
.mini.primary{background:var(--rose-xl);border-color:transparent;color:var(--rose-d);font-weight:600}
.sum-row{display:flex;justify-content:space-between;font-size:14.5px;margin:12px 0 5px}
.sum-row span:last-child{font-weight:600}
.sum-bar{height:8px;border-radius:8px;background:#F4ECE9;overflow:hidden}
.sum-bar i{display:block;height:100%;background:var(--rose);border-radius:8px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0}
.kv b{font-weight:600}

/* guests */
.g-counts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.g-count{background:var(--card);border-radius:16px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.g-count b{display:block;font-size:22px}
.g-count span{font-size:12.5px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;margin-bottom:12px;outline:none}
.g-row{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:14px;padding:8px 8px 8px 8px;box-shadow:var(--shadow)}
.g-name{flex:1;min-width:0;text-align:right;border:0;background:none;font-size:15.5px;padding:8px 6px;overflow-wrap:anywhere}
.g-cnt{display:inline-block;min-width:22px;font-size:12px;font-weight:600;background:var(--rose-xl);color:var(--rose-d);border-radius:10px;padding:1px 7px;margin-inline-start:6px;vertical-align:1px}
.g-count small{display:block;font-size:11px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px;justify-content:center}
.stepper button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:24px;color:var(--rose-d)}
.stepper b{font-size:28px;min-width:44px;text-align:center}
.pill{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 10px;font-size:13px;color:var(--muted)}
.pill.inv{background:var(--gold-l);border-color:transparent;color:#7C6234;font-weight:600}
.pill.conf{background:var(--ok-l);border-color:transparent;color:var(--ok);font-weight:600}

/* sheet */
#sheet-root{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet-root.open{pointer-events:auto}
.sheet-backdrop{position:absolute;inset:0;background:rgba(61,43,46,.35);opacity:0;transition:opacity .22s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);
  border-radius:24px 24px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
#sheet-root.show .sheet-backdrop{opacity:1}
#sheet-root.show .sheet{transform:none}
.sheet-grab{width:44px;height:5px;border-radius:5px;background:#D9C6C0;margin:4px auto 10px;position:relative}
.sheet-grab:before{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
.sheet h3{font-size:21px;margin:4px 0 14px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:13.5px;color:var(--muted);margin:0 2px 6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px 13px;outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--rose)}
.field textarea{min-height:80px;resize:vertical}
.field input[type=date],.field input[type=time]{display:block;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:8px 12px;font-size:14px}
.chip.on{background:var(--rose-d);border-color:var(--rose-d);color:#fff}
.hint{font-size:12.5px;color:var(--muted);margin:8px 2px 0;line-height:1.5}
.photo-box{display:flex;gap:10px;align-items:center}
.photo-box img{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;font-size:0}
.pay-list .kv{font-size:14px}

/* lock / onboarding */
.lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:calc(env(safe-area-inset-top) + 40px) 24px calc(env(safe-area-inset-bottom) + 18px);
  background:linear-gradient(170deg,#F3D9D8 0%,#FBF6F1 60%)}
.lock-top{text-align:center}
.logo{width:76px;height:76px;border-radius:22px;margin:0 auto 14px;display:block;box-shadow:0 6px 20px rgba(167,99,108,.25)}
.lock h1{font-size:24px;margin:0 0 6px;font-weight:600}
.lock p{margin:0;color:#6E5558;font-size:15px}
.dots{display:flex;gap:16px;justify-content:center;margin-top:26px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rose-d)}
.dots i.on{background:var(--rose-d)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keypad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px;direction:ltr;justify-content:center}
.key{width:78px;height:78px;border-radius:50%;border:0;background:rgba(255,255,255,.75);font-size:30px;font-weight:300;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.key:active{background:var(--rose-l)}
.key.fn{background:none;box-shadow:none;font-size:15px;color:var(--rose-d)}
.key.fn svg{width:28px;height:28px}

.ob{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 36px) 22px calc(env(safe-area-inset-bottom) + 24px);
  background:linear-gradient(170deg,#F3D9D8 0%,#FBF6F1 55%)}
.ob h1{text-align:center;font-size:27px;margin:0 0 6px;font-weight:600}
.ob .sub{text-align:center;color:#6E5558;margin:0 0 26px;line-height:1.5}
.steps{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.steps ol{margin:0;padding-inline-start:22px;line-height:1.9;font-size:15.5px}
.steps svg{width:18px;height:18px;vertical-align:-3px;color:#2F7BF5}
.warn{background:#FFF6E6;color:#7C6234;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:16px}

.banner{display:flex;gap:10px;align-items:center;background:#FFF6E6;border-radius:16px;padding:12px 14px;margin-top:14px;font-size:14px;color:#7C6234}
.banner .btn{flex:none}

/* toast & confirm */
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-20px);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:24px;font-size:14.5px;opacity:0;transition:.25s;z-index:90;pointer-events:none;max-width:86%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.confirm{position:fixed;inset:0;z-index:80;background:rgba(61,43,46,.4);display:grid;place-items:center;padding:24px}
.confirm-box{background:var(--bg);border-radius:20px;padding:20px;width:100%;max-width:340px}
.confirm-box p{margin:0 0 18px;font-size:16px;line-height:1.5;text-align:center}
.viewer{position:fixed;inset:0;z-index:85;background:rgba(0,0,0,.92);display:grid;place-items:center;padding:20px}
.viewer img{max-width:100%;max-height:100%;border-radius:8px}
.warn-strong{background:#FDECEC;border:1.5px solid #E7A9AD;color:#8A3B42;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.6;margin:4px 0 10px}
.check-row{display:flex;gap:10px;align-items:center;font-size:15px;margin:6px 2px 16px}
.check-row input{width:22px;height:22px;flex:none;accent-color:var(--rose-d)}
.q-box{background:var(--card);border-radius:14px;padding:14px;text-align:center;font-weight:600;font-size:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.key:disabled{opacity:.35}
#cover{position:fixed;inset:0;z-index:300;display:none;place-items:center;background:linear-gradient(170deg,#F3D9D8 0%,#FBF6F1 60%)}
#cover img{width:96px;height:96px;border-radius:26px;box-shadow:0 6px 20px rgba(167,99,108,.25)}
body.covered #cover{display:grid}
.foot-note{text-align:center;font-size:12.5px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet-root"></div>
<div id="toast"></div>
<div id="cover"><img src="icons/icon-180.png" alt=""></div>

<script>
'use strict';
/* ========== helpers ========== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((x, y) => x + (Number(y) || 0), 0);
const money = n => '₪' + Math.round(Number(n) || 0).toLocaleString('he-IL');
const pad = n => String(n).padStart(2, '0');
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseDate = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const daysUntil = iso => { const t = new Date(); t.setHours(0,0,0,0); return Math.round((parseDate(iso) - t) / 864e5); };
const fmt = (iso, o) => new Intl.DateTimeFormat('he-IL', o).format(parseDate(iso));
const fmtDay = iso => fmt(iso, {weekday:'short', day:'numeric', month:'long'});
const fmtLong = iso => fmt(iso, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isMobile = isIOS || /Android/i.test(navigator.userAgent);

function gematria(n) {
  const ones = ['','א','ב','ג','ד','ה','ו','ז','ח','ט'], tens = ['','י','כ','ל','מ','נ','ס','ע','פ','צ'];
  const hund = ['','ק','ר','ש','ת','תק','תר','תש','תת','תתק'];
  let s = hund[Math.floor(n / 100)] || ''; const r = n % 100;
  if (r === 15) s += 'טו'; else if (r === 16) s += 'טז'; else s += tens[Math.floor(r / 10)] + ones[r % 10];
  return s.length > 1 ? s.slice(0, -1) + '״' + s.slice(-1) : s + '׳';
}
function hebDate(iso) {
  try {
    const parts = new Intl.DateTimeFormat('he-u-ca-hebrew', {day:'numeric', month:'long', year:'numeric'}).formatToParts(parseDate(iso));
    return parts.map(p => {
      if ((p.type === 'day' || p.type === 'year') && /^\d+$/.test(p.value)) return gematria(+p.value % 1000);
      return p.value;
    }).join('');
  } catch (e) { return ''; }
}

/* ========== icons ========== */
const I = {

/* ========== crypto helpers ========== */
const te = new TextEncoder();
const toHex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
const hexToBytes = h => new Uint8Array((h.match(/../g) || []).map(x => parseInt(x, 16)));
const randBytes = n => crypto.getRandomValues(new Uint8Array(n));
const randHex = n => toHex(randBytes(n));
const toB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const fromB64 = b => { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function pbkdf2Hex(pass, saltHex, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveBits']);
  return toHex(new Uint8Array(await crypto.subtle.deriveBits({name: 'PBKDF2', salt: hexToBytes(saltHex), iterations: iter, hash: 'SHA-256'}, base, 256)));
}
async function aesKey(pass, salt, iter) {
  const base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['encrypt', 'decrypt']);
}
/* answer to the secret question: ignore case, niqqud, punctuation and extra spaces */
const normAnswer = a => String(a || '').toLowerCase().replace(/[֑-ׇ]/g, '').replace(/["'״׳.,!?־\-]/g, '').replace(/\s+/g, ' ').trim();

/* ========== too many wrong tries → wait ========== */
let G = {fails: 0, until: 0};
const WAIT_STEPS = [30, 60, 300, 900];
const guardLeft = () => Math.max(0, (G.until || 0) - Date.now());
async function guardFail() { G.fails = (G.fails || 0) + 1; if (G.fails >= 5) G.until = Date.now() + WAIT_STEPS[Math.min(G.fails - 5, 3)] * 1000; await DB.put('kv', 'guard', G); }
async function guardReset() { G = {fails: 0, until: 0}; await DB.put('kv', 'guard', G); }
const mmss = ms => { const t = Math.ceil(ms / 1000); return `${Math.floor(t / 60)}:${pad(t % 60)}`; };
let guardTimer = null;
function ensureGuardTimer() {
  if (guardTimer || !guardLeft()) return;
  guardTimer = setInterval(() => {
    if (app.dataset.mode === 'pin') renderPin();
    if (!guardLeft()) { clearInterval(guardTimer); guardTimer = null; if (app.dataset.mode === 'pin') renderPin(); }
  }, 1000);
}

/* ========== restore safety: keep only known fields of the right type ========== */
function cleanData(x) {
  x = x && typeof x === 'object' ? x : {};
  const str = (v, m = 1000) => v == null ? '' : String(v).slice(0, m);
  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
  const bool = v => v === true;
  const date = v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : '';
  const time = v => /^\d{2}:\d{2}$/.test(v) ? v : '';
  const id = v => typeof v === 'string' && /^[a-z0-9]{1,40}$/i.test(v) ? v : uid();
  const ref = v => typeof v === 'string' && /^[a-z0-9]{1,40}$/i.test(v) ? v : null;
  const alert = v => ALERTS.some(a => a[0] === Number(v)) ? Number(v) : -1;
  const arr = (v, f) => Array.isArray(v) ? v.filter(o => o && typeof o === 'object').map(f) : [];
  const hex = v => typeof v === 'string' && /^[0-9a-fx-]{1,128}$/i.test(v) ? v : '';
  const st = x.settings && typeof x.settings === 'object' ? x.settings : null;
  let settings = null;
  if (st && date(st.date) && hex(st.pinHash)) {
    settings = {bride: str(st.bride, 80), groom: str(st.groom, 80), date: st.date, salt: /^[a-z0-9]{1,64}$/i.test(st.salt) ? st.salt : '', pinHash: st.pinHash, created: num(st.created)};
    const r = st.recovery;
    if (r && typeof r === 'object' && hex(r.salt) && hex(r.hash) && num(r.iter) >= 10000 && num(r.iter) <= 2000000)
      settings.recovery = {q: str(r.q, 200), salt: r.salt, hash: r.hash, iter: num(r.iter)};
  }
  return Object.assign(blank(), {
    settings,
    expenses: arr(x.expenses, e => ({id: id(e.id), amount: num(e.amount), title: str(e.title, 200), cat: str(e.cat, 60), payer: PAYERS.includes(e.payer) ? e.payer : '', date: date(e.date), note: str(e.note), vendorId: ref(e.vendorId), photo: ref(e.photo), created: num(e.created)})),
    vendors: arr(x.vendors, v => ({id: id(v.id), name: str(v.name, 200), cat: str(v.cat, 60), phone: str(v.phone, 40), total: num(v.total), note: str(v.note), created: num(v.created)})),
    appts: arr(x.appts, a => ({id: id(a.id), title: str(a.title, 200), date: date(a.date), time: time(a.time), place: str(a.place, 300), note: str(a.note), alert: alert(a.alert), created: num(a.created)})),
    tasks: arr(x.tasks, t => ({id: id(t.id), title: str(t.title, 300), done: bool(t.done), doneAt: t.doneAt ? num(t.doneAt) : null, due: date(t.due), time: time(t.time), note: str(t.note), alert: alert(t.alert), created: num(t.created)})),
    guests: arr(x.guests, g => ({id: id(g.id), name: str(g.name, 200), count: Math.min(99, Math.max(1, Math.round(num(g.count)) || 1)), invited: bool(g.invited), confirmed: bool(g.confirmed)})),
    gifts: arr(x.gifts, g => ({id: id(g.id), name: str(g.name, 200), amount: num(g.amount), type: str(g.type, 40), note: str(g.note, 300), created: num(g.created)})),
    lastBackup: x.lastBackup ? num(x.lastBackup) : null,
  });
}
const goodPhoto = v => typeof v === 'string' && v.length < 15e6 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/]+=*$/.test(v);

/* ========== backup / restore ========== */
const BACKUP_ITER = 250000;
function backupSheet() {

async function makeBackupFile(pass) {
  const photos = {}; for (const [k, v] of await DB.entries('photos')) photos[k] = v;
  const plain = te.encode(JSON.stringify({app: 'my-wedding', v: 1, data: D, photos}));
  const salt = randBytes(16), iv = randBytes(12);
  const ct = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, await aesKey(pass, salt, BACKUP_ITER), plain);
  const json = JSON.stringify({app: 'my-wedding', v: 2, enc: {alg: 'AES-GCM', kdf: 'PBKDF2-SHA256', iter: BACKUP_ITER, salt: toB64(salt), iv: toB64(iv)}, payload: toB64(new Uint8Array(ct))});
  return new File([json], `my-wedding-backup-${todayISO()}.json`, {type: 'application/json'});
}
async function backupDone() { D.lastBackup = Date.now(); await saveNow(); S.backupFile = null; closeSheet(); toast('הגיבוי נשמר ✓'); if (D.settings && !S.locked && app.dataset.mode === 'main') renderMain(); }
function backupSave() {   // called straight from the tap, so the iPhone share sheet is allowed to open
  const file = S.backupFile; if (!file) return;
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    navigator.share({files: [file], title: 'גיבוי – החתונה שלי'}).then(backupDone).catch(e => { if (e.name !== 'AbortError') toast('השמירה נכשלה, נסי שוב'); });
    return;
  }
  const u = URL.createObjectURL(file); const a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
  backupDone();
}
async function decryptBackup(p, pass) {
  const e = p.enc, iter = Number(e.iter);
  if (e.alg !== 'AES-GCM' || !(iter >= 100000 && iter <= 2000000)) throw new Error('bad');
  const pt = await crypto.subtle.decrypt({name: 'AES-GCM', iv: fromB64(e.iv)}, await aesKey(pass, fromB64(e.salt), iter), fromB64(p.payload));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function doRestore(file) {
  let p; try { p = JSON.parse(await file.text()); } catch (e) { p = null; }
  if (!p || p.app !== 'my-wedding') return toast('הקובץ לא תקין – צריך קובץ גיבוי של האפליקציה');
  if (p.enc) {
    S.restoreFile = p;
    return openSheet(`<h3>שחזור מגיבוי 🔒</h3>
      <div class="field"><label>הסיסמה של הגיבוי</label><input type="password" name="rp" autocomplete="current-password"></div>
      <button class="btn" data-act="restoreUnlock">שחזור</button>`);
  }
  applyRestore(p);   // older backup without a password
}
async function applyRestore(p) {
  const data = cleanData(p.data);
  if (!data.settings) return toast('הקובץ לא תקין – צריך קובץ גיבוי של האפליקציה');
  if (D.settings && !(await confirmBox('השחזור יחליף את כל הנתונים שכרגע באפליקציה. להמשיך?', 'שחזור', false))) return;
  const photos = Object.entries(p.photos && typeof p.photos === 'object' ? p.photos : {}).filter(([k, v]) => /^[a-z0-9]{1,40}$/i.test(k) && goodPhoto(v));
  const keep = new Set(photos.map(([k]) => k)); data.expenses.forEach(e => { if (e.photo && !keep.has(e.photo)) e.photo = null; });
  D = data; await saveNow();
  await DB.clear('photos'); for (const [k, v] of photos) await DB.put('photos', k, v);
  S.invited = true; await DB.put('kv', 'invited', true);
  S.restoreFile = null; closeSheet(); S.locked = true; S.pin = {mode: 'unlock', ctx: null, buf: '', first: ''}; render(); toast('השחזור הצליח ✓ הקלידי את הקוד');
}

/* ----- PIN screen ----- */
function renderPin(shake) {
  app.dataset.mode = 'pin';
  const p = S.pin;
  const title = p.mode === 'unlock' ? 'החתונה שלי' : p.mode === 'create' ? (p.ctx === 'change' ? 'קוד חדש' : 'בחירת קוד') : 'אימות הקוד';
  const wait = p.mode === 'unlock' ? guardLeft() : 0;
  const left5 = 5 - (G.fails || 0);
  const sub = wait ? `יותר מדי ניסיונות. נסי שוב בעוד ${mmss(wait)}`
    : p.mode === 'unlock' ? ((G.fails || 0) >= 3 && left5 > 0 ? `קוד שגוי. נותרו ${left5} ניסיונות` : 'הקלידי את הקוד שלך')
    : p.mode === 'create' ? 'בחרי קוד של 4 ספרות' : 'הקלידי את הקוד שוב';
  if (wait) ensureGuardTimer();
  const k = n => `<button class="key" data-act="key" data-k="${n}"${wait ? ' disabled' : ''}>${n}</button>`;
  const left = p.mode === 'unlock' ? `<button class="key fn" data-act="forgotPin">שכחתי</button>`
    : p.ctx === 'change' ? `<button class="key fn" data-act="pinCancel">ביטול</button>` : `<span></span>`;

    <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k).join('')}${left}${k(0)}<button class="key fn" data-act="key" data-k="del" aria-label="מחיקה">${I.del}</button></div>
  </div>`;
}
async function pinKey(kv) {
  const p = S.pin;
  if (kv === 'del') { p.buf = p.buf.slice(0, -1); return renderPin(); }
  if (p.buf.length >= 4) return;
  if (p.mode === 'unlock' && guardLeft()) return;
  p.buf += kv; renderPin();
  if (p.buf.length < 4) return;
  await new Promise(r => setTimeout(r, 120));
  if (p.mode === 'unlock') {
    const h = await hashPin(p.buf, D.settings.salt);
    if (h === D.settings.pinHash) { await guardReset(); S.locked = false; p.buf = ''; S.lastTab = null; render(); }
    else { await guardFail(); p.buf = ''; renderPin(true); if (navigator.vibrate) navigator.vibrate(120); }
  } else if (p.mode === 'create') { p.first = p.buf; p.buf = ''; p.mode = 'confirm'; renderPin(); }
  else if (p.mode === 'confirm') {
    if (p.buf !== p.first) { p.buf = ''; p.first = ''; p.mode = 'create'; renderPin(true); toast('הקודים לא תאמו – נסי שוב'); return; }
    const salt = randHex(16); const pinHash = await hashPin(p.buf, salt);
    if (p.ctx === 'onboard') {
      D.settings = {bride: S.ob.bride.trim(), groom: S.ob.groom.trim(), date: S.ob.date, salt, pinHash, created: Date.now()};
      if (!D.tasks.length) D.tasks = [];
    } else { D.settings.salt = salt; D.settings.pinHash = pinHash; }
    await saveNow();
    const ctx = p.ctx; S.pin = {mode: 'unlock', ctx: null, buf: '', first: ''}; S.locked = false; S.lastTab = null; render();
    if (ctx !== 'onboard') { await guardReset(); toast('הקוד עודכן ✓'); }
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  }
}

/* gifts → CSV file that opens in Excel / Numbers / Google Sheets (Hebrew-safe) */
async function exportGifts() {
  const G = (D.gifts || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'he'));
  const c = v => { const t = String(v ?? ''); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const rows = [['שם', 'סכום', 'סוג', 'הערה'], ...G.map(g => [g.name, g.amount || '', g.type || '', g.note || '']), [], ['סה״כ', sum(G.map(g => g.amount)), '', `${G.length} מתנות`]];
  const csv = '\ufeff' + rows.map(r => r.map(c).join(',')).join('\r\n');
  const file = new File([csv], `wedding-gifts-${todayISO()}.csv`, {type: 'text/csv'});
  if (navigator.canShare && navigator.canShare({files: [file]})) {
    try { await navigator.share({files: [file], title: 'רשימת מתנות'}); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const u = URL.createObjectURL(file); const a = document.createElement('a'); a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 60000);
}

/* ========== actions ========== */
const byId = (arr, id) => arr.find(x => x.id === id);
const num = s => { const n = parseFloat(String(s).replace(/[^\d.]/g, '')); return isNaN(n) ? 0 : n; };
const ACT = {
  tab: el => { S.tab = el.dataset.tab; closeSheet(); renderMain(); },
  goGuests: () => { S.tab = 'guests'; renderMain(); setTimeout(() => $('[name=g]')?.focus(), 50); },
  seg: el => { S[el.dataset.k] = el.dataset.v; S.lastTab = null; renderMain(); },
  gseg: el => { S.guestSeg = el.dataset.v; renderGuestList(); },
  closeSheet,
  chip: el => {
    const g = el.closest('.chips'); $$('.chip', g).forEach(c => c.classList.toggle('on', c === el));
    if (g.dataset.fill) { const inp = $(`.sheet [name="${g.dataset.fill}"]`); if (inp) inp.value = el.dataset.val; }
  },
  key: el => pinKey(el.dataset.k),
  skipInstall: () => { S.skipInstall = true; render(); },
  pinCancel: () => { S.pin = {mode: 'unlock', ctx: null, buf: '', first: ''}; S.locked = false; S.lastTab = null; render(); },
  forgotPin: () => {
    if (guardLeft()) return toast('צריך לחכות ' + mmss(guardLeft()));
    const r = D.settings.recovery;
    if (!r) return openSheet(`<h3>שכחתי את הקוד</h3><p class="hint" style="text-align:center;margin-bottom:14px">עוד לא נבחרה שאלה סודית.<br>אפשר לשחזר הכול מקובץ גיבוי, או למחוק את הנתונים ולהתחיל מחדש.</p>
      <div class="btn-col"><label class="btn file-btn">${I.upload} שחזור מקובץ גיבוי<input type="file" accept=".json,application/json" data-change="restore"></label>
      <button class="btn danger" data-act="wipe">מחיקת כל הנתונים</button></div>`);
    openSheet(`<h3>שכחתי את הקוד</h3><p class="hint" style="text-align:center;margin-bottom:10px">עני על השאלה הסודית שבחרת:</p>
      <div class="q-box">${esc(r.q)}</div>
      <div class="field"><label>התשובה</label><input name="fans" autocomplete="off"></div>
      <button class="btn" data-act="forgotCheck">המשך</button>`);
  },
  forgotCheck: async el => {
    if (guardLeft()) return toast('צריך לחכות ' + mmss(guardLeft()));
    const r = D.settings.recovery; if (!r) return;
    el.disabled = true;
    const ok = (await pbkdf2Hex(normAnswer(val('fans')), r.salt, r.iter)) === r.hash;
    el.disabled = false;
    if (ok) { await guardReset(); closeSheet(); S.pin = {mode: 'create', ctx: 'reset', buf: '', first: ''}; renderPin(); }
    else { await guardFail(); if (guardLeft()) { closeSheet(); renderPin(); } toast('התשובה לא נכונה'); }
  },
  changeRecovery: () => { closeSheet(); S.recoveryCtx = 'change'; render(); },
  recCancel: () => { S.recoveryCtx = null; S.lastTab = null; render(); },
  backupMake: async el => {
    const a = val('bp1'), b = $('.sheet [name=bp2]').value;
    if (a.length < 6) return toast('הסיסמה צריכה לפחות 6 תווים');
    if ($('.sheet [name=bp1]').value !== b) return toast('הסיסמאות לא זהות');
    if (!$('.sheet [name=bsaved]').checked) return toast('סמני ✓ שהסיסמה שמורה אצלך');
    el.disabled = true; el.textContent = 'מכין גיבוי…';
    try { S.backupFile = await makeBackupFile($('.sheet [name=bp1]').value); }
    catch (e) { el.disabled = false; el.textContent = 'יצירת גיבוי'; return toast('הגיבוי נכשל'); }
    openSheet(`<h3>הגיבוי מוכן ✓</h3>
      <p class="hint" style="text-align:center;margin-bottom:16px">הקובץ נעול בסיסמה שבחרת.<br>עכשיו שמרי אותו: ב"קבצים", ב-iCloud, או שלחי לעצמך.</p>
      <button class="btn" data-act="backupSave">${I.share} שמירת הקובץ</button>`);
  },
  backupSave,
  restoreUnlock: async el => {
    const pw = $('.sheet [name=rp]').value; if (!pw || !S.restoreFile) return;
    el.disabled = true; el.textContent = 'פותח…';
    let payload;
    try { payload = await decryptBackup(S.restoreFile, pw); }
    catch (e) { el.disabled = false; el.textContent = 'שחזור'; return toast('הסיסמה לא נכונה'); }
    if (!payload || payload.app !== 'my-wedding') return toast('הקובץ לא תקין');
    applyRestore(payload);
  },
  changePin: () => { closeSheet(); S.pin = {mode: 'create', ctx: 'change', buf: '', first: ''}; S.locked = true; renderPin(); },
  lockNow: () => { closeSheet(); S.locked = true; S.pin = {mode: 'unlock', ctx: null, buf: '', first: ''}; render(); },
  settings: settingsSheet,
  saveSettings: () => {
    const b = val('bride'), g = val('groom'), d = val('date');
    if (!b || !g || !d) return toast('צריך למלא את כל הפרטים');
    Object.assign(D.settings, {bride: b, groom: g, date: d}); save(); closeSheet(); renderMain(); toast('נשמר ✓');
  },
  backup: backupSheet,
  wipe: async () => {
    if (!(await confirmBox('למחוק את כל הנתונים מהאפליקציה? אי אפשר לבטל את זה. כדאי לגבות קודם.'))) return;
    if (!(await confirmBox('בטוח? הכול יימחק לצמיתות.', 'כן, למחוק הכול'))) return;
    D = blank(); await saveNow(); await DB.clear('photos'); await guardReset(); closeSheet(); S.locked = true; S.ob = {}; S.tab = 'home'; render();
  },
  installHelp: () => openSheet(`<h3>התקנה במסך הבית</h3><div class="steps">${isIOS
    ? `<ol><li>פותחים את הקישור ב<b>ספארי</b></li><li>לוחצים על כפתור השיתוף ${I.iosShare}</li><li>בוחרים <b>"הוסף למסך הבית"</b> ← <b>"הוסף"</b></li></ol>`
    : `<ol><li>לוחצים על התפריט ⋮ בדפדפן</li><li>בוחרים <b>"הוספה למסך הבית"</b></li></ol>`}</div>
    <div class="warn">הנתונים שהוזנו בדפדפן לא עוברים לאפליקציה במסך הבית. אם כבר הזנת: גיבוי עכשיו ← ואז שחזור בתוך האפליקציה המותקנת.</div>
    <button class="btn" data-act="backup">גיבוי עכשיו</button>`),

  /* appointments */
  newAppt: () => apptSheet(null),
  editAppt: el => { const a = byId(D.appts, el.dataset.id); if (a) apptSheet(a); },
  saveAppt: el => {
    const title = val('title') || chipVal('type'), date = val('date');
    if (!title) return toast('מה סוג התור?'); if (!date) return toast('צריך לבחור תאריך');
    const data = {title, date, time: val('time'), place: val('place'), note: val('note'), alert: Number(chipVal('alert') ?? -1)};
    let a = byId(D.appts, el.dataset.id);

    save(); renderMain();
    if (el.dataset.cal) calendarSheet(apptToEv(a)); else { closeSheet(); toast('התור נשמר ✓'); }
  },
  apptCal: el => { const a = byId(D.appts, el.dataset.id); if (a) calendarSheet(apptToEv(a)); },
  calOpen: () => { if (S.calEv) openICS(S.calEv); },
  calShare: () => { if (S.calEv) shareICS(S.calEv); },
  delAppt: async el => { if (!(await confirmBox('למחוק את התור?'))) return; D.appts = D.appts.filter(a => a.id !== el.dataset.id); save(); closeSheet(); renderMain(); },
  shareAppt: el => { const a = byId(D.appts, el.dataset.id); if (!a) return;
    waShare(`📅 ${a.title}\n${fmtLong(a.date)}${a.time ? ' בשעה ' + a.time : ''}${a.place ? '\n📍 ' + a.place : ''}${a.note ? '\n' + a.note : ''}`); },

  /* tasks */
  newTask: () => taskSheet(null),
  editTask: el => { const t = byId(D.tasks, el.dataset.id); if (t) taskSheet(t); },
  toggleTask: el => { const t = byId(D.tasks, el.dataset.id); if (!t) return; t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save(); renderMain(); if (t.done) toast('כל הכבוד! ✓'); },
  toggleDone: () => { S.showDone = !S.showDone; renderMain(); },
  starterTasks: () => { STARTER_TASKS.forEach((title, i) => D.tasks.push({id: uid(), title, done: false, created: Date.now() + i, alert: -1})); save(); renderMain(); toast('נוספו ' + STARTER_TASKS.length + ' משימות – אפשר למחוק ולערוך'); },
  saveTask: el => {
    const title = val('title'); if (!title) return toast('מה המשימה?');
    const data = {title, due: val('due'), time: val('time'), note: val('note'), alert: Number(chipVal('alert') ?? -1)};
    if (el.dataset.cal && !data.due) return toast('בשביל יומן צריך תאריך');

  shareTasks: () => { const open = sortTasks(D.tasks.filter(t => !t.done));
    waShare('📝 משימות לחתונה:\n' + open.map(t => `• ${t.title}${t.due ? ' (עד ' + fmt(t.due, {day: 'numeric', month: 'numeric'}) + ')' : ''}`).join('\n')); },

  /* expenses & vendors */
  newExpense: () => expenseSheet(null),
  editExpense: el => { const e = byId(D.expenses, el.dataset.id); if (e) expenseSheet(e); },
  vendorPay: el => { const v = byId(D.vendors, el.dataset.id); if (v) expenseSheet(null, {vendorId: v.id, cat: v.cat, title: 'תשלום ל' + v.name}); },
  saveExpense: async el => {
    const amount = num(val('amount')); if (!amount) return toast('מה הסכום?');
    const vendorId = val('vendorId'); const v = vendorId ? byId(D.vendors, vendorId) : null;
    const data = {amount, title: val('title'), cat: chipVal('cat') || (v && v.cat) || '', payer: chipVal('payer') || '', date: val('date'), note: val('note'), vendorId: vendorId || null};
    let e = byId(D.expenses, el.dataset.id);
    const p = S.sheetPhoto; const oldPhoto = e && e.photo;
    if (p && p.data && !p.id) { const pid = uid(); await DB.put('photos', pid, p.data); data.photo = pid; }
    else data.photo = p && p.id ? p.id : null;
    if (oldPhoto && oldPhoto !== data.photo) DB.del('photos', oldPhoto);
    if (e) Object.assign(e, data); else { e = Object.assign({id: uid(), created: Date.now()}, data); D.expenses.push(e); }
    save(); closeSheet(); renderMain(); toast('ההוצאה נשמרה ✓');
  },
  delExpense: async el => { if (!(await confirmBox('למחוק את ההוצאה?'))) return; const e = byId(D.expenses, el.dataset.id);
    if (e && e.photo) DB.del('photos', e.photo); D.expenses = D.expenses.filter(x => x.id !== el.dataset.id); save(); closeSheet(); renderMain(); },
  removePhoto: () => { S.sheetPhoto = null; $('#photoBox').innerHTML = photoBoxHTML(); },
  viewPhoto: () => { const p = S.sheetPhoto; if (!p) return; const d = document.createElement('div'); d.className = 'viewer'; const im = new Image(); im.src = p.data; d.appendChild(im); d.onclick = () => d.remove(); document.body.appendChild(d); },
  newVendor: () => vendorSheet(null),
  editVendor: el => { const v = byId(D.vendors, el.dataset.id); if (v) vendorSheet(v); },
  saveVendor: el => {
    const name = val('name'); if (!name) return toast('מה שם הספק?');
    const data = {name, cat: chipVal('cat') || '', phone: val('phone'), total: num(val('total')), note: val('note')};
    const v = byId(D.vendors, el.dataset.id);
    if (v) Object.assign(v, data); else D.vendors.push(Object.assign({id: uid(), created: Date.now()}, data));
    save(); closeSheet(); renderMain(); toast('הספק נשמר ✓');
  },
  delVendor: async el => {
    const n = D.expenses.filter(e => e.vendorId === el.dataset.id).length;
    if (!(await confirmBox(n ? `למחוק את הספק? ${n} התשלומים שלו יישארו ברשימת ההוצאות.` : 'למחוק את הספק?'))) return;
    D.expenses.forEach(e => { if (e.vendorId === el.dataset.id) e.vendorId = null; });
    D.vendors = D.vendors.filter(v => v.id !== el.dataset.id); save(); closeSheet(); renderMain();
  },
  shareVendor: el => { const v = byId(D.vendors, el.dataset.id); if (!v) return; const paid = vendorPaid(v.id);
    waShare(`🤝 ${v.name}${v.cat ? ' – ' + v.cat : ''}${v.phone ? '\n📞 ' + v.phone : ''}${v.total ? `\nמחיר: ${money(v.total)}\nשולם: ${money(paid)}\nנשאר: ${money(Math.max(0, v.total - paid))}` : ''}${v.note ? '\n' + v.note : ''}`); },
  shareSummary: () => {
    const m = {}; D.expenses.forEach(e => { const k = e.cat || 'אחר'; m[k] = (m[k] || 0) + (Number(e.amount) || 0); });
    waShare(`💰 סיכום הוצאות לחתונה\nסה״כ: ${money(sum(D.expenses.map(e => e.amount)))}\n\n` + Object.entries(m).sort((a, b) => b[1] - a[1]).map(([k, v]) => `• ${k}: ${money(v)}`).join('\n'));
  },

  /* gifts */
  newGift: () => giftSheet(null),
  editGift: el => { const g = byId(D.gifts, el.dataset.id); if (g) giftSheet(g); },
  saveGift: el => {
    const name = val('name'); if (!name) return toast('ממי המתנה?');
    const data = {name, amount: num(val('amount')), type: chipVal('type') || '', note: val('note')};
    const g = byId(D.gifts, el.dataset.id);
    if (g) Object.assign(g, data); else D.gifts.push(Object.assign({id: uid(), created: Date.now()}, data));
    save(); renderMain();
    if (el.dataset.next) { giftSheet(null); toast('נשמר ✓ אפשר להוסיף עוד'); setTimeout(() => $('.sheet [name=name]')?.focus(), 300); }
    else { closeSheet(); toast('המתנה נשמרה ✓'); }
  },
  delGift: async el => { if (!(await confirmBox('למחוק את המתנה?'))) return; D.gifts = D.gifts.filter(g => g.id !== el.dataset.id); save(); closeSheet(); renderMain(); },
  exportGifts: () => exportGifts().catch(() => toast('הייצוא נכשל')),

  /* guests */
  gInv: el => { const g = byId(D.guests, el.dataset.id); if (!g) return; g.invited = !g.invited; if (!g.invited) g.confirmed = false; save(); renderGuestList(); },
  gConf: el => { const g = byId(D.guests, el.dataset.id); if (!g) return; g.confirmed = !g.confirmed; if (g.confirmed) g.invited = true; save(); renderGuestList(); },
  editGuest: el => { const g = byId(D.guests, el.dataset.id); if (g) guestSheet(g); },
  saveGuest: el => { const g = byId(D.guests, el.dataset.id); const n = val('name'); if (!g || !n) return; g.name = n; g.count = +$('#gcount').textContent || 1; save(); closeSheet(); renderGuestList(); },
  step: el => { const b = $('#gcount'); b.textContent = Math.min(99, Math.max(1, (+b.textContent || 1) + Number(el.dataset.d))); },
  delGuest: async el => { if (!(await confirmBox('למחוק מהרשימה?'))) return; D.guests = D.guests.filter(g => g.id !== el.dataset.id); save(); closeSheet(); renderGuestList(); },
  importGuests: importSheet,
  importPaste: () => { const n = addGuestNames(parseNames(val('names'))); closeSheet(); renderGuestList(); toast(n ? `נוספו ${n} מוזמנים ✓` : 'לא נוספו שמות חדשים'); },
  shareGuests: () => {
    const seg = S.guestSeg; const title = {all: 'רשימת מוזמנים', not: 'עוד לא הוזמנו', inv: 'הוזמנו', conf: 'אישרו הגעה'}[seg];
    const list = D.guests.filter(guestFilter(seg)).sort((a, b) => a.name.localeCompare(b.name, 'he'));
    if (!list.length) return toast('הרשימה ריקה');
    waShare(`💌 ${title} (${people(list)} איש):\n` + list.map(g => `• ${g.name}${gCount(g) > 1 ? ' (' + gCount(g) + ')' : ''}${seg === 'all' ? (g.confirmed ? ' ✅' : g.invited ? ' ✉️' : '') : ''}`).join('\n'));
  },
};
const FORMS = {
  recovery: async f => {
    const q = f.q.value === 'custom' ? f.qc.value.trim() : f.q.value;
    if (q.length < 5) return toast('כתבי את השאלה');
    const a1 = normAnswer(f.a1.value), a2 = normAnswer(f.a2.value);
    if (a1.length < 2) return toast('כתבי תשובה');
    if (a1 !== a2) return toast('התשובות לא זהות');
    const first = !D.settings.recovery; const salt = randHex(16), iter = 200000;
    const hash = await pbkdf2Hex(a1, salt, iter);
    D.settings.recovery = {q, salt, hash, iter}; await saveNow();
    S.recoveryCtx = null; S.lastTab = null; render();
    toast(first ? 'הכול מוכן! מזל טוב 💍' : 'השאלה הסודית עודכנה ✓');
  },
  invite: async f => {
    const code = f.code.value.replace(/\D/g, '');
    if (!code) return toast('הזיני את קוד ההזמנה');
    let ok = false; try { ok = (await inviteHash(code)) === INVITE_HASH; } catch (e) {}
    if (!ok) { f.code.value = ''; toast('הקוד לא נכון'); return; }
    S.invited = true; await DB.put('kv', 'invited', true); render();
  },
  onboard: f => {
    const b = f.bride.value.trim(), g = f.groom.value.trim(), d = f.date.value;
    if (!b || !g || !d) return toast('צריך למלא את כל הפרטים');
    S.ob = {bride: b, groom: g, date: d}; S.pin = {mode: 'create', ctx: 'onboard', buf: '', first: ''}; renderPin();
  },
  quickTask: f => { const t = f.t.value.trim(); if (!t) return; D.tasks.push({id: uid(), title: t, done: false, created: Date.now(), alert: -1}); save(); renderMain(); $('[name=t]')?.focus(); },
  quickGuest: f => { const o = splitGuest(f.g.value.trim()); if (!o.name) return;
    if (D.guests.some(g => g.name.trim() === o.name)) { toast('השם כבר ברשימה'); return; }
    D.guests.push({id: uid(), name: o.name, count: o.count, invited: false, confirmed: false}); save(); f.g.value = ''; renderGuestList(); f.g.focus(); },
};
const CHANGES = {
  recQ: el => { $('#qcWrap').style.display = el.value === 'custom' ? '' : 'none'; },
  restore: inp => { const f = inp.files[0]; if (f) doRestore(f); inp.value = ''; },
  photo: async inp => { const f = inp.files[0]; if (!f) return; try { S.sheetPhoto = {id: null, data: await compressImage(f)}; $('#photoBox').innerHTML = photoBoxHTML(); } catch (e) { toast('לא הצלחתי לפתוח את התמונה'); } },
  importFile: async inp => {
    const f = inp.files[0]; if (!f) return; inp.value = '';
    try {
      const names = /\.xlsx$/i.test(f.name) ? await readXlsx(await f.arrayBuffer()) : parseNames(await f.text());
      const n = addGuestNames(names); closeSheet(); renderGuestList(); toast(n ? `נוספו ${n} מוזמנים ✓` : 'לא נמצאו שמות חדשים בקובץ');
    } catch (e) { toast('לא הצלחתי לקרוא את הקובץ. אפשר להעתיק ולהדביק את השמות.'); }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  e.preventDefault(); e.stopPropagation(); fn(el, e);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) CHANGES[el.dataset.change]?.(el); });
document.addEventListener('input', e => {
  if (e.target.dataset.input === 'guestQ') { S.guestQ = e.target.value; renderGuestList(); }
  if (e.target.dataset.input === 'giftQ') { S.giftQ = e.target.value; const q = S.giftQ.trim();
    $('#giftlist').innerHTML = giftRows(D.gifts.filter(g => !q || g.name.includes(q)).sort((a, b) => (b.created || 0) - (a.created || 0)), D.gifts.length); }
});

/* hide the content while the app is in the background (app switcher picture) */
const cover = on => { if (on && !D.settings) return; document.body.classList.toggle('covered', on); };
window.addEventListener('blur', () => cover(true));
window.addEventListener('pagehide', () => cover(true));
window.addEventListener('focus', () => cover(false));
$('#cover').addEventListener('pointerdown', () => cover(false));

/* auto-lock after 1 minute in background */
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  cover(document.hidden);
  if (document.hidden) hiddenAt = Date.now();
  else if (D.settings && !S.locked && hiddenAt && Date.now() - hiddenAt > 60000) {
    closeSheet(); S.locked = true; S.pin = {mode: 'unlock', ctx: null, buf: '', first: ''}; render();
  } else if (D.settings && !S.locked && app.dataset.mode === 'main' && S.tab === 'home') renderMain();
});

/* ========== start ========== */
(async function start() {
  try { await DB.open(); const d = await DB.get('kv', 'data'); if (d) D = Object.assign(blank(), d); S.invited = !!(await DB.get('kv', 'invited'));
    const g = await DB.get('kv', 'guard'); if (g) G = g;
    if (D.settings && !S.invited) { S.invited = true; await DB.put('kv', 'invited', true); } }
  catch (e) { app.innerHTML = '<div class="empty" style="padding-top:80px">לא ניתן לפתוח את האחסון במכשיר.<br>אם את במצב גלישה פרטית – יש לפתוח בחלון רגיל.</div>'; return; }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  if (window.caches) caches.delete('ics-v1').catch(() => {});
  render();
})();
</script>
</body>
